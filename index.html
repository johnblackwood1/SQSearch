<html>
  <head>
    <title>SQSearch</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  </head>
  <body>
    <div style="text-align: center;">
      <img src="sqsearchlogo.png" alt="SQSearch">
    </div>
    <p style="text-align: center;">Structured Query Search</p>
    
    <input type="text" id="searchbox" placeholder="Type here to search the site database">
    <hr>
    <ul id="result"></ul>
    <script>
        let db;

        async function init() {
          const SQL = await initSqlJs({
            locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}`
          });
          const buf = await (await fetch('sitedatabaselite.db')).arrayBuffer();
          db = new SQL.Database(new Uint8Array(buf));

          const searchbox = document.getElementById('searchbox');
          const result = document.getElementById('result');

          searchbox.addEventListener('input', e => {
            const val = e.target.value.trim();
            result.innerHTML = '';
            if (!val || !db) return;

            try {
              const stmt = db.prepare('SELECT "1", "google.com" FROM sites WHERE "google.com" MATCH ? LIMIT 20');
              stmt.bind([`${val}*`]);

              while (stmt.step()) {
                const row = stmt.get();
                result.innerHTML += `<li><span>${row[1]}</span><span class="rank">#${row[0]}</span></li>`;
              }
              stmt.free();
            } catch (err) {}
          });
        }

        init();
    </script>
  </body>
</html>
